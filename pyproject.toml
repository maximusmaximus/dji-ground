[project]
name = "dji-ground"
version = "0.1.0"
description = "Local ground station for DJI aircraft with Hermes MCP flight authority, 3D modeling, and web UI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Maxin", email = "maxin@example.com" }
]
dependencies = [
    "fastmcp>=0.4.0",
    "mcp>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "av>=12.3.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
vision = [
    "ultralytics>=8.2.0",
]

[project.scripts]
dji-ground = "dji_ground.mcp_server:main"
dji-gateway = "dji_ground.gateway:main"
dji-station = "scripts.run_station:run_station"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dji_ground"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
